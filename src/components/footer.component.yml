name: Footer
machineName: footer
status: true
required:
  - backgroundColor
  - copyrightNotice
props:
  properties:
    backgroundColor:
      type: string
      enum:
        - chalk
        - paper
        - acid
        - ink
      meta:enum:
        chalk: Chalk
        paper: Paper
        acid: Acid
        ink: Ink
      title: Background color
      examples:
        - chalk
    copyrightNotice:
      type: string
      contentMediaType: text/html
      x-formatting-context: block
      title: Copyright notice
      examples:
        - '&copy; 2025-2026 Humanify Example Ventures Inc.'
    linkedInUrl:
      type: string
      format: uri-reference
      title: LinkedIn URL
      examples:
        - https://www.linkedin.com
    xUrl:
      type: string
      format: uri-reference
      title: X URL
      examples:
        - https://x.com
    emailUrl:
      type: string
      format: uri-reference
      title: Email URL
      examples:
        - mailto:hello@example.com
slots:
  branding:
    title: Branding
